<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0b1019" />
      <stop offset="100%" stop-color="#06070a" />
    </linearGradient>

    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#75aadb" />
      <stop offset="100%" stop-color="#a8d8ea" />
    </linearGradient>

    <linearGradient id="barcaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004d98" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a50044" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="goldTen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#75aadb" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#75aadb" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#004d98" stop-opacity="0.6" />
      <stop offset="85%" stop-color="#a50044" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#75aadb" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.03" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .title { font-weight: 800; letter-spacing: 0.12em; fill: #ffffff; }
    .subtitle { font-weight: 600; letter-spacing: 0.22em; fill: #75aadb; }
    .desc { font-weight: 400; fill: #94a3b8; font-size: 13px; }
    .tag { font-weight: 600; font-size: 10px; letter-spacing: 0.18em; fill: #cbd5e1; }
    .ten-big { font-weight: 900; font-family: -apple-system, BlinkMacSystemFont, 'Impact', 'Segoe UI Black', sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="900" height="280" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1" />
  <rect width="900" height="280" rx="16" fill="url(#grid)" />

  <!-- Ambient Barça/Argentina Glow Circles -->
  <circle cx="820" cy="60" r="140" fill="#004d98" opacity="0.15" filter="url(#glow)" />
  <circle cx="740" cy="200" r="100" fill="#a50044" opacity="0.12" filter="url(#glow)" />
  <circle cx="100" cy="180" r="120" fill="#75aadb" opacity="0.08" filter="url(#glow)" />

  <!-- Tactical Pitch Subtle Accents -->
  <circle cx="780" cy="140" r="90" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04" stroke-dasharray="3 3" />
  <path d="M 690 140 L 870 140" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04" />
  <rect x="740" y="90" width="100" height="100" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03" />

  <!-- Massive #10 Watermark Silhouette -->
  <text x="755" y="225" text-anchor="middle" class="ten-big" font-size="210" fill="url(#goldTen)">10</text>

  <!-- Top Metadata Bar -->
  <g transform="translate(42, 40)">
    <rect x="0" y="0" width="6" height="6" fill="#75aadb" rx="1" />
    <text x="16" y="7" class="mono" font-size="11" fill="#75aadb" letter-spacing="0.15em">PLAYER 10 // SEASON 2026</text>
    <text x="320" y="7" class="mono" font-size="11" fill="#475569">•</text>
    <text x="340" y="7" class="mono" font-size="11" fill="#64748b" letter-spacing="0.15em">ENGINEERING FIRST TEAM</text>
  </g>

  <!-- Accent Divider Line -->
  <rect x="42" y="58" width="580" height="2" rx="1" fill="url(#lineGrad)" />

  <!-- Main Name Header -->
  <g transform="translate(42, 115)">
    <text x="0" y="0" class="sans title" font-size="44">ABHINAV</text>
    <g transform="translate(255, -28)">
      <rect x="0" y="0" width="58" height="32" rx="6" fill="#0f172a" stroke="#75aadb" stroke-width="1.2" stroke-opacity="0.8" />
      <text x="29" y="21" text-anchor="middle" class="mono" font-weight="700" font-size="14" fill="#75aadb">#10</text>
    </g>
  </g>

  <!-- Subtitle -->
  <text x="42" y="148" class="mono subtitle" font-size="13">SOFTWARE ENGINEER • BACKEND &amp; SYSTEMS</text>

  <!-- Core Summary Description -->
  <text x="42" y="180" class="sans desc">Architecting resilient backend systems and full-stack products with</text>
  <text x="42" y="200" class="mono" font-size="12.5" font-weight="600" fill="#e2e8f0">Java • Spring Boot • React • Node.js • PostgreSQL • AI Workflows</text>

  <!-- Bottom Identity Tag Pill -->
  <g transform="translate(42, 230)">
    <rect x="0" y="0" width="460" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="13" r="3.5" fill="#75aadb" />
    <circle cx="28" cy="13" r="3.5" fill="#a50044" />
    <circle cx="42" cy="13" r="3.5" fill="#004d98" />
    <text x="58" y="17" class="mono tag">ARGENTINA MENTALITY • BARÇA CREATIVITY • DISCIPLINE</text>
  </g>
</svg>
