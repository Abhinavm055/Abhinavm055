<svg width="100%" height="200" viewBox="0 0 900 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky Gradients -->
    <linearGradient id="skyGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#040914" />
      <stop offset="55%" stop-color="#071426" />
      <stop offset="85%" stop-color="#0B1D33" />
      <stop offset="100%" stop-color="#03070D" />
    </linearGradient>

    <radialGradient id="nebulaGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#102B46" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#0B1D33" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#040914" stop-opacity="0" />
    </radialGradient>

    <!-- Moon Glow & Crescent -->
    <radialGradient id="moonAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67D9FF" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#3B82C4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#071426" stop-opacity="0" />
    </radialGradient>

    <mask id="crescentMask">
      <rect width="900" height="200" fill="#ffffff" />
      <circle cx="756" cy="46" r="14" fill="#000000" />
    </mask>

    <!-- Horizon Mist -->
    <linearGradient id="mistGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#67D9FF" stop-opacity="0" />
      <stop offset="60%" stop-color="#102B46" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#03070D" stop-opacity="0.8" />
    </linearGradient>

    <!-- Border Accent -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#102B46" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#3B82C4" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#67D9FF" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#3B82C4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#102B46" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="200" rx="12" fill="url(#skyGrad)" />
  
  <!-- Subtle Atmospheric Nebula -->
  <rect width="900" height="200" rx="12" fill="url(#nebulaGlow)" />

  <!-- Moonlit Glow & Crescent Moon -->
  <circle cx="750" cy="50" r="48" fill="url(#moonAura)" />
  <circle cx="750" cy="50" r="14" fill="#D8F3FF" mask="url(#crescentMask)" />
  <circle cx="745" cy="52" r="1.5" fill="#67D9FF" opacity="0.6" />

  <!-- Stars -->
  <g fill="#D8F3FF">
    <circle cx="68" cy="34" r="0.75" opacity="0.4" />
    <circle cx="112" cy="72" r="1" opacity="0.65" />
    <circle cx="156" cy="28" r="0.8" opacity="0.35" />
    <circle cx="204" cy="54" r="1.2" opacity="0.75" />
    <circle cx="260" cy="88" r="0.75" opacity="0.3" />
    <circle cx="310" cy="30" r="1" opacity="0.5" />
    <circle cx="375" cy="62" r="0.8" opacity="0.4" />
    <circle cx="430" cy="24" r="1.1" opacity="0.6" />
    <circle cx="490" cy="40" r="0.75" opacity="0.35" />
    <circle cx="545" cy="22" r="1" opacity="0.55" />
    <circle cx="598" cy="68" r="0.85" opacity="0.45" />
    <circle cx="652" cy="38" r="1.2" opacity="0.7" />
    <circle cx="688" cy="82" r="0.75" opacity="0.3" />
    <circle cx="712" cy="28" r="0.9" opacity="0.5" />
    <circle cx="810" cy="65" r="1.1" opacity="0.6" />
    <circle cx="848" cy="32" r="0.8" opacity="0.4" />
    <circle cx="875" cy="78" r="1" opacity="0.5" />
    <circle cx="82" cy="115" r="0.75" opacity="0.35" />
    <circle cx="170" cy="125" r="0.9" opacity="0.4" />
    <circle cx="792" cy="118" r="0.8" opacity="0.35" />
    <circle cx="840" cy="130" r="0.75" opacity="0.3" />
  </g>

  <!-- Cyan Sparkle Stars -->
  <path d="M 220 38 Q 220 42 224 42 Q 220 42 220 46 Q 220 42 216 42 Q 220 42 220 38 Z" fill="#67D9FF" opacity="0.65" />
  <path d="M 670 48 Q 670 51 673 51 Q 670 51 670 54 Q 670 51 667 51 Q 670 51 670 48 Z" fill="#67D9FF" opacity="0.55" />
  <path d="M 340 76 Q 340 78 342 78 Q 340 78 340 80 Q 340 78 338 78 Q 340 78 340 76 Z" fill="#D8F3FF" opacity="0.45" />

  <!-- Distant Fog / Horizon Mist -->
  <rect x="0" y="130" width="900" height="70" fill="url(#mistGrad)" />

  <!-- Mountain & Forest Silhouette Layer 1 (Midground) -->
  <path d="M 0 200 L 0 178 L 24 175 L 48 180 L 82 172 L 120 176 L 158 168 L 188 174 L 224 167 L 270 175 L 316 169 L 360 176 L 412 170 L 458 174 L 512 168 L 564 175 L 618 167 L 664 174 L 710 166 L 754 173 L 798 165 L 842 172 L 878 168 L 900 173 L 900 200 Z" fill="#071426" opacity="0.5" />

  <!-- Forest Pine Silhouette Layer 2 (Foreground Deep Silhouette) -->
  <path d="M 0 200 L 0 186 L 12 181 L 20 186 L 34 179 L 46 187 L 58 182 L 72 188 L 88 178 L 98 187 L 115 180 L 132 188 L 152 176 L 165 186 L 182 180 L 198 188 L 218 177 L 230 187 L 252 181 L 274 189 L 305 182 L 328 189 L 358 181 L 382 188 L 418 179 L 442 187 L 478 180 L 504 188 L 536 178 L 562 187 L 594 181 L 624 189 L 658 177 L 682 187 L 714 180 L 738 188 L 766 176 L 788 186 L 814 179 L 838 188 L 862 178 L 882 186 L 900 180 L 900 200 Z" fill="#03070D" />

  <!-- Center Ambient Starlight Glow behind Name -->
  <ellipse cx="450" cy="95" rx="260" ry="50" fill="#67D9FF" fill-opacity="0.04" />

  <!-- Main Name Typography -->
  <text x="450" y="96" fill="#E6EEF5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" letter-spacing="0.32em" text-anchor="middle">ABHINAV</text>

  <!-- Tagline -->
  <text x="450" y="126" fill="#67D9FF" font-family="'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="500" letter-spacing="0.28em" text-anchor="middle" opacity="0.9">DEVELOPER  ·  BACKEND EXPLORER  ·  BUILDER</text>

  <!-- Subtle Minimal Center Divider Motif -->
  <circle cx="435" cy="144" r="1.5" fill="#3B82C4" opacity="0.6" />
  <line x1="442" y1="144" x2="458" y2="144" stroke="#67D9FF" stroke-width="1" opacity="0.7" />
  <circle cx="465" cy="144" r="1.5" fill="#3B82C4" opacity="0.6" />

  <!-- Outer Frame & Top Highlight -->
  <rect x="0.75" y="0.75" width="898.5" height="198.5" rx="11.25" stroke="#102B46" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="140" y1="1" x2="760" y2="1" stroke="url(#borderGrad)" stroke-width="1.5" stroke-linecap="round" />
</svg>
