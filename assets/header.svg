<svg width="100%" height="160" viewBox="0 0 900 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="160" rx="10" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Pattern Overlay -->
  <rect width="900" height="160" rx="10" fill="url(#grid)" />
  
  <!-- Ambient Center Glow -->
  <ellipse cx="450" cy="80" rx="320" ry="70" fill="url(#glow)" />

  <!-- Outer Border -->
  <rect x="0.75" y="0.75" width="898.5" height="158.5" rx="9.25" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Top Accent Highlight -->
  <line x1="120" y1="1" x2="780" y2="1" stroke="url(#borderGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Main Name Typography -->
  <text x="450" y="78" fill="url(#textGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="0.22em" text-anchor="middle">ABHINAV</text>

  <!-- Tagline -->
  <text x="450" y="112" fill="#38bdf8" font-family="'SF Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0.25em" text-anchor="middle">DEVELOPER  ·  BACKEND EXPLORER  ·  BUILDER</text>

  <!-- Bottom Accent Dots -->
  <circle cx="430" cy="132" r="2" fill="#38bdf8" fill-opacity="0.4" />
  <circle cx="450" cy="132" r="2.5" fill="#38bdf8" fill-opacity="0.8" />
  <circle cx="470" cy="132" r="2" fill="#38bdf8" fill-opacity="0.4" />
</svg>
