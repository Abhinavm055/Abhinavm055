<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="100%">
  <defs>
    <linearGradient id="trophyCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="skyBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#75aadb" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#004d98" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; }
    .trophy-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.05em; }
    .trophy-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 10.5px; fill: #94a3b8; line-height: 1.3; }
  </style>

  <rect width="900" height="160" rx="14" fill="url(#trophyCard)" stroke="#1e293b" stroke-width="1" />

  <!-- Item 1: Real-Time Systems -->
  <g transform="translate(24, 20)">
    <rect width="198" height="120" rx="10" fill="#0c121e" stroke="#1e293b" stroke-width="1" />
    <circle cx="28" cy="28" r="14" fill="#0f1f38" stroke="#75aadb" stroke-width="0.8" />
    <!-- Lightning Icon -->
    <path d="M 29 20 L 23 28 L 28 28 L 27 36 L 33 28 L 28 28 Z" fill="#75aadb" />
    <text x="50" y="32" class="trophy-title">REAL-TIME ENGINE</text>
    <text x="14" y="66" class="trophy-sub">Multiplayer IPL live</text>
    <text x="14" y="82" class="trophy-sub">auction &amp; bidding sync</text>
    <rect x="14" y="98" width="65" height="14" rx="3" fill="#172033" />
    <text x="46" y="108" text-anchor="middle" class="mono" font-size="8" fill="#75aadb">FIREBASE • WS</text>
  </g>

  <!-- Item 2: Multi-Agent AI -->
  <g transform="translate(242, 20)">
    <rect width="198" height="120" rx="10" fill="#0c121e" stroke="#1e293b" stroke-width="1" />
    <circle cx="28" cy="28" r="14" fill="#1f1024" stroke="#a50044" stroke-width="0.8" />
    <!-- Shield / Brain Icon -->
    <path d="M 28 20 L 34 23 V 28 C 34 32 28 35 28 35 C 28 35 22 32 22 28 V 23 Z" fill="none" stroke="#f472b6" stroke-width="1.2" />
    <text x="50" y="32" class="trophy-title">AI SOC TRIAGE</text>
    <text x="14" y="66" class="trophy-sub">4-Agent threat pipeline</text>
    <text x="14" y="82" class="trophy-sub">&amp; risk scoring platform</text>
    <rect x="14" y="98" width="60" height="14" rx="3" fill="#241220" />
    <text x="44" y="108" text-anchor="middle" class="mono" font-size="8" fill="#f472b6">MULTI-AGENT</text>
  </g>

  <!-- Item 3: Full Stack Products -->
  <g transform="translate(460, 20)">
    <rect width="198" height="120" rx="10" fill="#0c121e" stroke="#1e293b" stroke-width="1" />
    <circle cx="28" cy="28" r="14" fill="#0f1f38" stroke="#004d98" stroke-width="0.8" />
    <!-- Stack / Box Icon -->
    <path d="M 22 26 L 28 22 L 34 26 L 28 30 Z M 22 30 L 28 34 L 34 30 M 22 34 L 28 38 L 34 34" fill="none" stroke="#60a5fa" stroke-width="1.2" />
    <text x="50" y="32" class="trophy-title">HOUSING PLATFORM</text>
    <text x="14" y="66" class="trophy-sub">Co-living matchmaking</text>
    <text x="14" y="82" class="trophy-sub">&amp; role-based workflows</text>
    <rect x="14" y="98" width="68" height="14" rx="3" fill="#172033" />
    <text x="48" y="108" text-anchor="middle" class="mono" font-size="8" fill="#60a5fa">POSTGRES • NEON</text>
  </g>

  <!-- Item 4: Backend & Data Architecture -->
  <g transform="translate(678, 20)">
    <rect width="198" height="120" rx="10" fill="#0c121e" stroke="#1e293b" stroke-width="1" />
    <circle cx="28" cy="28" r="14" fill="#0f1f38" stroke="#75aadb" stroke-width="0.8" />
    <!-- Server / DB Icon -->
    <path d="M 23 24 C 23 22 33 22 33 24 C 33 26 23 26 23 24 Z M 23 27 C 23 29 33 29 33 27 M 23 30 C 23 32 33 32 33 30" fill="none" stroke="#75aadb" stroke-width="1.2" />
    <text x="50" y="32" class="trophy-title">BACKEND SYSTEMS</text>
    <text x="14" y="66" class="trophy-sub">Spring Boot enterprise</text>
    <text x="14" y="82" class="trophy-sub">&amp; RESTful APIs</text>
    <rect x="14" y="98" width="72" height="14" rx="3" fill="#172033" />
    <text x="50" y="108" text-anchor="middle" class="mono" font-size="8" fill="#75aadb">SPRING • JAVA</text>
  </g>
</svg>
